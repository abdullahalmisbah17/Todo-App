<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="w-full min-h-screen bg-gray-300 flex justify-center my-[100px]">
    <div class="w-[480px] bg-white p-4 rounded-md">
      <h2 class="text-[26px] font-semibold text-center">Todo app</h2>

      <form id="main_form" action="" class="pt-4 flex">
        <input
          id="create_input"
          class="w-full border border-gray-400 p-2 rourded-md"
          type="text"
          placeholder="Type your task ..."
        />
        <button
          id="submit_form_btn"
          class="p-2 bg-green-600 ml-2 rounded-md cursor-pointer text-white"
          type="submit"
        >
          Add
        </button>
      </form>
      <span id="error_msg" class="text-xs text-red-500 hidden"
        >Please write something in input box.
      </span>
      <div id="task-list-parent" class="mt-4"></div>
      <div class="flex items-center justify-between mt-6">
        <p>You have <span id="total_task_count">0</span> task</p>
        <button
          id="clear_task"
          class="text-danger bg-neutral-primary border border-danger hover:bg-danger hover:text-white focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-sm text-xs px-3 py-1.5 focus:outline-none"
        >
          Clear all
        </button>
      </div>
    </div>

    <!-- revise  -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
